<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quote · QuoteDesk</title>
    <link rel="stylesheet" href="/css/flow.css" />
    <link rel="stylesheet" href="/css/run.css" />
    <script type="module" src="/js/runpage/run.js"></script>
  </head>
  <body class="flow">
    <div class="rp">
      <aside id="side" class="rp-side" aria-label="Call progress"></aside>
      <main class="rp-main">
        <header class="rp-top">
          <div id="pills" class="rp-pills" aria-label="Your stay"></div>
          <div id="actions" class="rp-actions"></div>
        </header>
        <div class="rp-body">
          <section class="rp-content">
            <div id="intro" class="rp-intro"></div>
            <div id="feature"></div>
            <div id="steps"></div>
            <div id="quotes"></div>
            <div id="grid" class="rp-card"></div>
          </section>
          <aside id="panel" class="rp-panel" aria-label="Selected call"></aside>
        </div>
      </main>
    </div>
  </body>
</html>
